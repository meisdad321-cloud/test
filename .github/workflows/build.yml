name: Build GiantQuake Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname 'GiantQuake-1.20.1-Forge*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: 找不到 GiantQuake 源码 ZIP 文件。"
            echo "请将源码 ZIP 上传到仓库根目录。"
            exit 1
          fi

          echo "找到源码压缩包：$ZIP_FILE"
          unzip -o "$ZIP_FILE" -d source

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail
          BUILD_FILE="$(find source -type f -name build.gradle -print -quit)"

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: 解压后没有找到 build.gradle。"
            find source -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "项目目录：$PROJECT_DIR"

      - name: Verify Java and Gradle versions
        run: |
          java -version
          gradle --version

      - name: Build mod
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon build

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GiantQuake-1.20.1-Forge
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
